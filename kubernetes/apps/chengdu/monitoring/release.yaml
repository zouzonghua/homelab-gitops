apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: monitoring
spec:
  interval: 30m
  install:
    remediation:
      retries: 3
    timeout: 15m
  upgrade:
    remediation:
      retries: 3
    timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 87.18.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      interval: 1h
  values:
    alertmanager:
      enabled: false
    grafana:
      replicas: 1
      persistence:
        enabled: true
        storageClassName: nfs-client
        size: 5Gi
      initChownData:
        enabled: true

      service:
        type: ClusterIP
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    prometheus:
      prometheusSpec:
        replicas: 1
        retention: 3d
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        additionalScrapeConfigs:
          - job_name: pve
            scrape_interval: 5s
            scrape_timeout: 4s
            static_configs:
              - targets:
                  - 10.10.10.2:9100

