apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp-rbac
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://git@github.com/zouzonghua/homelab-gitops.git
    targetRevision: main
    path: kubernetes/clusters/chengdu/applications/headlamp-rbac
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
