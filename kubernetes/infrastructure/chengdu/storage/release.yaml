apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-subdir-external-provisioner
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: nfs-subdir-external-provisioner
      version: 4.0.18
      sourceRef:
        kind: HelmRepository
        name: nfs-subdir-external-provisioner
      interval: 12h
  values:
    nfs:
      server: 10.10.10.20
      path: /k8s
      mountOptions:
        - nfsvers=4
    storageClass:
      name: nfs-client
      defaultClass: false
      archiveOnDelete: true
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi
