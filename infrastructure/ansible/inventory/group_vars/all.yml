---
ansible_user: ops
ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519_homelab"
ops_ssh_public_key_file: "{{ ansible_ssh_private_key_file }}.pub"

k3s_version: v1.36.1+k3s1
k3s_token: "{{ lookup('env', 'K3S_TOKEN') }}"
k3s_disable:
  - servicelb

kube_vip_version: v1.2.2

ntp_servers:
  - 10.10.10.1
ntp_fallback_servers:
  - ntp.aliyun.com
  - cn.pool.ntp.org
