---
- name: 验证 ops 并停用旧用户
  hosts: k3s_servers
  become: true
  gather_facts: false
  serial: 1
  tasks:
    - name: 验证 ops sudo
      ansible.builtin.command: /usr/bin/true
      changed_when: false

    - name: 移除旧用户的 SSH 公钥
      ansible.builtin.file:
        path: /home/debian/.ssh/authorized_keys
        state: absent

    - name: 锁定旧 debian 用户
      ansible.builtin.user:
        name: debian
        password_lock: true
        shell: /usr/sbin/nologin
